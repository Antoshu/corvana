# Curated names: what the pack calls a thing that is not already a column of its row. Loaded into the entity
# tables' aliases[] column (issuers, instruments, curves); the loader drops an entry that equals a name column of
# the same row (legal_name, short_name, ticker, ISIN, curve_id), so the array holds only the extra names. The
# alias view unions the columns and the array; source here says where the name was seen and is not loaded.
# Deliberately absent: "the state", "the government", "the sovereign", "the parent" (resolved in context by
# extraction), the unnamed CorTel holding company, CPL's strategic investor, "the 2033", XS2812345672.
# Removed on 2026-11-01 with the rework: the agency rows (no agency table) and the currency rows "dinar" /
# "the dinar" (a currency is a code on instruments, curves and country, not a table, so it has no aliases column).
