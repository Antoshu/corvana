[project]
name = "kl"
version = "0.1.0"
description = "Corvana knowledge layer: Postgres model, agent tools, MCP server"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "anthropic>=0.40",
    "mcp>=2.0",
    "pydbml>=1.2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
kl-schema = "kl.schema_gen:main"
kl-load = "kl.load:main"
kl-validate = "kl.validate:main"
kl-demo = "kl.demo:main"
kl-agent = "kl.agent:main"
kl-annotate = "kl.extract:main"
kl-update = "kl.ingest_update:main"
kl-mcp = "kl.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:pydbml"]
markers = ["experimental: relationship extraction, off by default and outside the contract",
           "stress: ingest stress test on a scratch database (tests/stress); skipped by default, run with -m stress"]
addopts = ["-m", "not stress"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
system-certs = true
